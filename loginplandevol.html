<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Défense : Connexion</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/cotrnBV.png">

<style>
body {
    margin:0; padding:0; font-family:Arial,sans-serif;
    background-image:url('https://i.imgur.com/7yarc9G.jpeg');
    background-size:cover; background-position:center; background-attachment:fixed;
    color:#fff; min-height:100vh;
    display:flex; justify-content:center; align-items:center;
}
.container {
    background-color: rgba(30,35,25,0.45);
    backdrop-filter: blur(12px);
    border-radius:16px; padding:50px 40px;
    max-width:480px; width:90%;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
    text-align:center;
}
.logo { max-width:160px; margin-bottom:30px; }
h1 { font-size:2.4em; margin-bottom:40px; }
label { font-weight:bold; display:block; text-align:left; margin-bottom:10px; }
input { width:100%; padding:16px; margin-bottom:25px; border-radius:8px; border:none; font-size:1.1em; background: rgba(255,255,255,0.12); color:white; }
input:focus { outline:none; background: rgba(255,255,255,0.25); }
button { background:#4B5320; color:white; border:none; padding:18px; font-size:1.3em; border-radius:8px; width:100%; cursor:pointer; font-weight:bold; }
button:hover { background:#3e451b; }
#error { margin-top:20px; color:#ff5555; min-height:24px; font-size:1.1em; text-align:center; }
#loadingOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; justify-content:center; align-items:center; flex-direction:column; z-index:9999; }
#loadingOverlay img { width:120px; }
#loadingOverlay p { font-size:1.8em; margin-top:20px; }
</style>
</head>
<body>

<div id="loadingOverlay">
    <img src="https://www.pngmart.com/files/23/Loading-PNG-Photos.gif" alt="Chargement">
    <p>Connexion en cours...</p>
</div>

<div class="container">
    <img src="https://i.imgur.com/cotrnBV.png" class="logo" alt="Logo La Défense">
    <h1>Connexion</h1>

    <form id="loginForm">
        <label>Nom d'utilisateur :</label>
        <input type="text" id="username" required>
        <label>Mot de passe :</label>
        <input type="password" id="password" required>
        <button type="submit">Se connecter</button>
    </form>
    <div id="error"></div>
</div>

<!-- Inclure Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ==============================================
    // CONFIGURATION SUPABASE
    // ==============================================
    const SUPABASE_URL = 'https://gktawbaposndfxijkxdk.supabase.co'; // ton URL Supabase
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdGF3YmFwb3NuZGZ4aWpreGRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNzUyNDUsImV4cCI6MjA3OTY1MTI0NX0.tY-CHuyb2zr9s6hlGkwmrdTvg920VVNghI9S45CjwKk';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById("loginForm");
    const errorDiv = document.getElementById("error");
    const loading = document.getElementById("loadingOverlay");

    loginForm.addEventListener("submit", async function(e){
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if(!username || !password){
            errorDiv.textContent = "Veuillez remplir tous les champs.";
            return;
        }

        loading.style.display = "flex";
        errorDiv.textContent = "";

        try{
            // Vérification dans Supabase
            const { data, error } = await supabase
                .from("login-pplgestion") // table Supabase
                .select("*")
                .eq("username", username)
                .eq("password", password)
                .limit(1);

            if(error) throw error;

            if(data && data.length > 0){
                // Login réussi
                window.location.href = "logsplanvol.html";
            } else {
                errorDiv.textContent = "Identifiants incorrects.";
            }
        } catch(err){
            console.error(err);
            errorDiv.textContent = "Erreur serveur : " + (err.message || err);
        } finally {
            loading.style.display = "none";
        }
    });
</script>

</body>
</html>
