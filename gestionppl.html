<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Défense : Gestion PPL</title>

<link rel="icon" type="image/png" href="https://i.imgur.com/cotrnBV.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://i.imgur.com/7yarc9G.jpeg') center/cover fixed;
    color: white;
}
.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 40px;
    background: rgba(30,35,25,0.45);
    backdrop-filter: blur(12px);
    border-radius: 16px;
}
.logo { display: block; margin: 0 auto 25px; max-width: 140px; }
h1 { text-align: center; }
.nav-header {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}
.nav-button {
    background-color: #4B5320;
    color: white;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}
.nav-button:hover { background-color: #3e451b; }

.create-btn {
    display: block;
    margin: 25px auto;
    padding: 14px 28px;
    background: #4B5320;
    color: white;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

.person-item {
    padding: 15px;
    background: rgba(255,255,255,0.1);
    margin-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
}
.person-item:hover { background: rgba(255,255,255,0.2); }

.detail-panel {
    margin-top: 30px;
    padding: 20px;
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    display: none;
}

.flight {
    padding: 10px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
}

.section-title { margin-top: 20px; font-weight: bold; text-decoration: underline; }

/* BADGES */
.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 0.85em;
    margin: 4px 4px 4px 0;
    color: white;
}

.badge-success { background-color: #28a745; }
.badge-warning { background-color: #ffc107; color: #000; }
.badge-danger { background-color: #dc3545; }

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
}
.modal-content {
    background: #2a2f24;
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 450px;
}
.modal-content input, .modal-content select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: none;
}
.modal-buttons { display: flex; gap: 15px; }
</style>
</head>

<body>
<div class="container">

<img src="https://i.imgur.com/cotrnBV.png" class="logo">

<h1>Gestion PPL</h1>

<div class="nav-header">
    <a href="logsplanvol.html" class="nav-button">Logs Plans de Vol</a>
    <a href="gestionppl.html" class="nav-button">Gestion PPL</a>
    <a href="rapportincident.html" class="nav-button">Rapport Incident</a>
</div>

<button class="create-btn" onclick="openModal()">+ Créer un PPL</button>

<ul id="personList"></ul>

<div id="detailPanel" class="detail-panel">
    <h2 id="detailName"></h2>
    <div id="detailBadges"></div>
    <div id="detailInfo"></div>
    <div id="flightsList"></div>
    <button onclick="closeDetail()">Fermer</button>
</div>

</div>

<!-- MODAL CRÉATION -->
<div id="createModal" class="modal">
<div class="modal-content">
<h3>Créer un PPL</h3>

<input id="nom" placeholder="Nom">
<input id="prenom" placeholder="Prénom">
<input id="instructeur" placeholder="Instructeur">

<select id="theorieavion"><option value="false">Théorie Avion : Non</option><option value="true">Théorie Avion : Oui</option></select>
<select id="permisavion"><option value="false">Permis Avion : Non</option><option value="true">Permis Avion : Oui</option></select>

<div class="modal-buttons">
<button onclick="closeModal()">Annuler</button>
<button onclick="savePPL()">Enregistrer</button>
</div>
</div>
</div>

<script>
const supabaseClient = supabase.createClient(
    'https://gktawbaposndfxijkxdk.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdGF3YmFwb3NuZGZ4aWpreGRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNzUyNDUsImV4cCI6MjA3OTY1MTI0NX0.tY-CHuyb2zr9s6hlGkwmrdTvg920VVNghI9S45CjwKk'
);

async function loadPersons() {
    const { data } = await supabaseClient.from('ppl-gestion').select('*').order('nom');
    const list = document.getElementById('personList');
    list.innerHTML = '';
    data.forEach(p => {
        const li = document.createElement('li');
        li.className = 'person-item';
        li.textContent = `${p.prenom} ${p.nom}`;
        li.onclick = () => showDetail(p);
        list.appendChild(li);
    });
}

function showDetail(p) {
    document.getElementById('detailName').textContent = `${p.prenom} ${p.nom}`;

    // ================== BADGES ==================
    const badges = [];
    if(p.theorieavion) badges.push('<span class="badge badge-success">Théorie Avion</span>');
    if(p.permisavion) badges.push('<span class="badge badge-success">Permis Avion</span>');
    if(p.theoriehelico) badges.push('<span class="badge badge-warning">Théorie Hélico</span>');
    if(p.permishelico) badges.push('<span class="badge badge-warning">Permis Hélico</span>');

    document.getElementById('detailBadges').innerHTML = badges.join(' ');

    document.getElementById('detailInfo').innerHTML = `
        Instructeur : ${p.instructeur || '—'}
    `;
    loadFlightsAndIncidents(p.nom, p.prenom);
    document.getElementById('detailPanel').style.display = 'block';
}

async function loadFlightsAndIncidents(nom, prenom) {
    const prenomNom = `${prenom} ${nom}`;
    const nomPrenom = `${nom} ${prenom}`;
    const vols = await supabaseClient.from('logs-plandevol')
        .select('*')
        .or(`pilote.ilike.${prenomNom},pilote.ilike.${nomPrenom}`);

    const incidents = await supabaseClient.from('rapportincident-ppl')
        .select('*')
        .or(`pilote.ilike.${prenomNom},pilote.ilike.${nomPrenom}`);

    const c = document.getElementById('flightsList');
    c.innerHTML = '<div class="section-title">Plans de vol</div>';
    vols.data.forEach(v => c.innerHTML += `<div class="flight">${v.lieudepart} → ${v.lieuarrive}</div>`);

    c.innerHTML += '<div class="section-title">⚠️ Incidents</div>';
    incidents.data.forEach(i => c.innerHTML += `<div class="flight">${i.lieucrash}</div>`);
}

function closeDetail() { document.getElementById('detailPanel').style.display='none'; }
function openModal() { document.getElementById('createModal').style.display='flex'; }
function closeModal() { document.getElementById('createModal').style.display='none'; }

async function savePPL() {
    await supabaseClient.from('ppl-gestion').insert([{
        nom: nom.value,
        prenom: prenom.value,
        instructeur: instructeur.value,
        theorieavion: theorieavion.value==='true',
        permisavion: permisavion.value==='true'
    }]);
    closeModal();
    loadPersons();
}

loadPersons();
</script>
</body>
</html>
