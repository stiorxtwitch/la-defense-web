<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Défense : Gestion PPL</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/cotrnBV.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('https://i.imgur.com/7yarc9G.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(75, 83, 32, 0.25);
            z-index: -2;
        }
        .container {
            background-color: rgba(30, 35, 25, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px;
            max-width: 1000px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 1;
            margin: 40px 0;
            overflow-y: auto;
            max-height: 90vh;
        }
        .logo {
            display: block;
            margin: 0 auto 25px;
            max-width: 140px;
        }
        h1 {
            text-align: center;
            font-size: 2.3em;
            margin-bottom: 20px;
        }
        .nav-header {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .nav-button {
            background-color: #4B5320;
            color: #fff;
            padding: 14px 28px;
            font-size: 1.1em;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .nav-button:hover {
            background-color: #3e451b;
        }
        button.create-btn {
            background-color: #4B5320;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            margin: 20px auto;
            display: block;
        }
        button.create-btn:hover {
            background-color: #3e451b;
        }
        .person-list {
            list-style: none;
            padding: 0;
        }
        .person-item {
            background: rgba(255,255,255,0.08);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .person-item:hover {
            background: rgba(255,255,255,0.18);
        }
        .detail-panel {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            display: none;
        }
        .detail-panel img {
            max-width: 240px;
            border-radius: 12px;
            margin: 15px auto;
            display: block;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #2a2f24;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .modal-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.05em;
        }
        .save-btn { background: #4B5320; color: white; }
        .cancel-btn { background: #555; color: white; }
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        #loadingOverlay img {
            width: 120px;
        }
    </style>
</head>
<body>
<div class="overlay"></div>

<div id="loadingOverlay">
    <img src="https://www.pngmart.com/files/23/Loading-PNG-Photos.gif">
    <p>Chargement...</p>
</div>

<div class="container">
    <img src="https://i.imgur.com/cotrnBV.png" class="logo" alt="Logo">

    <h1>Gestion PPL</h1>

    <div class="nav-header">
        <a href="logsplanvol.html" class="nav-button">Logs Plans de Vol</a>
        <a href="gestionppl.html" class="nav-button">Gestion PPL</a>
        <a href="rapportincident.html" class="nav-button">Rapport Incident</a>
    </div>

    <button class="create-btn" id="btnCreate">+ Créer un profil</button>

    <ul class="person-list" id="personList"></ul>

    <div id="detailPanel" class="detail-panel">
        <h2 id="detailName"></h2>
        <img id="detailPhoto" src="" alt="Photo" style="display:none;">
        <div id="detailInfo"></div>
        <h3>Plans de vol en tant que pilote</h3>
        <div id="flightsList"></div>
        <button onclick="closeDetail()">Fermer</button>
    </div>
</div>

<!-- Modal pour création de profil -->
<div id="createModal" class="modal">
    <div class="modal-content">
        <h2>Créer un profil PPL</h2>
        <label>Nom :</label>
        <input id="inputNom" type="text" required>

        <label>Prénom :</label>
        <input id="inputPrenom" type="text" required>

        <label>Date de passage :</label>
        <input id="inputDatePassage" type="date">

        <label>Théorie Avion :</label>
        <select id="inputTheorieAvion">
            <option value="false">Non</option>
            <option value="true">Oui</option>
        </select>

        <label>Permis Avion :</label>
        <select id="inputPermisAvion">
            <option value="false">Non</option>
            <option value="true">Oui</option>
        </select>

        <label>Théorie Hélico :</label>
        <select id="inputTheorieHelico">
            <option value="false">Non</option>
            <option value="true">Oui</option>
        </select>

        <label>Permis Hélico :</label>
        <select id="inputPermisHelico">
            <option value="false">Non</option>
            <option value="true">Oui</option>
        </select>

        <label>Instructeur :</label>
        <input id="inputInstructeur" type="text">

        <label>Lien photo (Imgur) :</label>
        <input id="inputLinkImage" type="url" placeholder="https://i.imgur.com/XXXXX.jpg">

        <div class="modal-buttons">
            <button class="modal-btn cancel-btn" onclick="closeModal()">Annuler</button>
            <button class="modal-btn save-btn" onclick="saveProfile()">Enregistrer</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ==============================================
    // SUPABASE – DÉCLARATION UNIQUE ET UNIQUE
    // ==============================================
    const SUPABASE_URL = 'https://gktawbaposndfxijkxdk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdGF3YmFwb3NuZGZ4aWpreGRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNzUyNDUsImV4cCI6MjA3OTY1MTI0NX0.tY-CHuyb2zr9s6hlGkwmrdTvg920VVNghI9S45CjwKk';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    console.log("Supabase chargé avec succès");

    const loading = document.getElementById('loadingOverlay');

    // ==============================================
    // FONCTIONS
    // ==============================================

    async function loadPersons() {
        loading.style.display = 'flex';
        try {
            const { data, error } = await supabase
                .from('ppl-gestion')
                .select('*')
                .order('nom', { ascending: true });

            if (error) throw error;

            const list = document.getElementById('personList');
            list.innerHTML = '';

            if (!data || data.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#aaa;">Aucun profil pour le moment</p>';
                return;
            }

            data.forEach(person => {
                const li = document.createElement('li');
                li.className = 'person-item';
                li.textContent = `${person.prenom || ''} ${person.nom || ''}`;
                li.onclick = () => showDetail(person);
                list.appendChild(li);
            });
        } catch (err) {
            console.error('Erreur chargement profils:', err);
            document.getElementById('personList').innerHTML = '<p style="color:#ff5555; text-align:center;">Erreur de chargement</p>';
        } finally {
            loading.style.display = 'none';
        }
    }

    function showDetail(person) {
        document.getElementById('detailName').textContent = `${person.prenom || ''} ${person.nom || ''}`;

        const photo = document.getElementById('detailPhoto');
        if (person.linkimage) {
            photo.src = person.linkimage;
            photo.style.display = 'block';
        } else {
            photo.style.display = 'none';
        }

        document.getElementById('detailInfo').innerHTML = `
            <p><strong>Date :</strong> ${person.datedepassage || '—'}</p>
            <p><strong>Théorie Avion :</strong> ${person.theorieavion ? 'Oui' : 'Non'}</p>
            <p><strong>Permis Avion :</strong> ${person.permisavion ? 'Oui' : 'Non'}</p>
            <p><strong>Théorie Hélico :</strong> ${person.theoriehelico ? 'Oui' : 'Non'}</p>
            <p><strong>Permis Hélico :</strong> ${person.permishelico ? 'Oui' : 'Non'}</p>
            <p><strong>Instructeur :</strong> ${person.instructeur || '—'}</p>
        `;

        loadFlights(person.nom, person.prenom);

        document.getElementById('detailPanel').style.display = 'block';
        window.scrollTo({ top: document.getElementById('detailPanel').offsetTop - 100, behavior: 'smooth' });
    }

    async function loadFlights(nom, prenom) {
        const container = document.getElementById('flightsList');
        container.innerHTML = '<p>Chargement...</p>';

        try {
            const { data, error } = await supabase
                .from('logs-plandevol')
                .select('*')
                .eq('pilote', `${nom} ${prenom}`)
                .order('created_at', { ascending: false })
                .limit(20);

            if (error) throw error;

            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<p>Aucun vol trouvé</p>';
                return;
            }

            data.forEach(vol => {
                const div = document.createElement('div');
                div.style.margin = '8px 0';
                div.style.padding = '10px';
                div.style.background = 'rgba(255,255,255,0.05)';
                div.style.borderRadius = '6px';
                div.innerHTML = `
                    <strong>${vol.dateduvol || '?'}</strong> — ${vol.lieudepart || '?'} → ${vol.lieuarrive || '?'}
                    <br><small>${vol.modele || '—'}</small>
                `;
                container.appendChild(div);
            });
        } catch (err) {
            console.error(err);
            container.innerHTML = '<p style="color:#ff5555;">Erreur vols</p>';
        }
    }

    function closeDetail() {
        document.getElementById('detailPanel').style.display = 'none';
    }

    function openModal() {
        document.getElementById('createModal').style.display = 'flex';
        // Reset tous les champs
        document.querySelectorAll('#createModal input, #createModal select').forEach(el => {
            if (el.type === 'select-one') el.value = 'false';
            else el.value = '';
        });
    }

    function closeModal() {
        document.getElementById('createModal').style.display = 'none';
    }

    async function saveProfile() {
        const nom = document.getElementById('inputNom').value.trim();
        const prenom = document.getElementById('inputPrenom').value.trim();

        if (!nom || !prenom) {
            alert("Nom et Prénom obligatoires !");
            return;
        }

        const data = {
            nom,
            prenom,
            datedepassage: document.getElementById('inputDatePassage').value || null,
            theorieavion: document.getElementById('inputTheorieAvion').value === 'true',
            permisavion: document.getElementById('inputPermisAvion').value === 'true',
            theoriehelico: document.getElementById('inputTheorieHelico').value === 'true',
            permishelico: document.getElementById('inputPermisHelico').value === 'true',
            instructeur: document.getElementById('inputInstructeur').value.trim() || null,
            linkimage: document.getElementById('inputLinkImage').value.trim() || null
        };

        try {
            const { error } = await supabase.from('ppl-gestion').insert([data]);
            if (error) throw error;

            alert('Profil créé !');
            closeModal();
            loadPersons();
        } catch (err) {
            console.error(err);
            alert('Erreur : ' + (err.message || 'Inconnue'));
        }
    }

    // ==============================================
    // ÉVÈNEMENTS + DÉMARRAGE
    // ==============================================
    document.addEventListener('DOMContentLoaded', () => {
        // Bouton Créer un profil
        document.getElementById('btnCreate').addEventListener('click', openModal);

        // Lancement initial
        loadPersons();
    });
</script>
</body>
</html>
