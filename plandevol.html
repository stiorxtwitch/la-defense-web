<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Défense : Plan et Récapitulatif de Vol</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/cotrnBV.png">
    <style>
        /* ⚠️ DESIGN STRICTEMENT IDENTIQUE */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-image: url('https://i.imgur.com/7yarc9G.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(75, 83, 32, 0.25);
            z-index: -2;
        }

        .container {
            background-color: rgba(30, 35, 25, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 40px;
            max-width: 620px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 1;
            position: relative;
        }

        .logo {
            display: block;
            margin: 0 auto 25px;
            max-width: 140px;
        }

        h1 {
            text-align: center;
            font-size: 2.3em;
            margin-bottom: 35px;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border-radius: 8px;
            border: none;
            background-color: rgba(255, 255, 255, 0.12);
            color: white;
        }

        button {
            background-color: #4B5320;
            color: white;
            padding: 16px;
            font-size: 1.25em;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 25px;
            text-align: center;
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }

        #loadingOverlay img {
            width: 120px;
        }

        #loadingOverlay p {
            font-size: 1.8em;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div id="loadingOverlay">
    <img src="https://www.pngmart.com/files/23/Loading-PNG-Photos.gif">
    <p>Envoi en cours</p>
</div>

<div class="container">
    <img src="https://i.imgur.com/cotrnBV.png" class="logo">
    <h1>La Défense : Plan et Récapitulatif de Vol</h1>

    <form id="volForm">
        <label>Nom du Pilote :</label>
        <input id="pilote" required>

        <label>Numéro de Vol :</label>
        <input id="numeroVol" required>

        <label>Date du Vol :</label>
        <input type="date" id="date" required>

        <label>Heure de Départ :</label>
        <input type="time" id="heureDepart" required>

        <label>Heure d'Arrivée :</label>
        <input type="time" id="heureArrivee" required>

        <label>Lieu de Départ :</label>
        <input id="depart" required>

        <label>Lieu d'Arrivée :</label>
        <input id="arrivee" required>

        <label>Type d'Avion :</label>
        <select id="typeAvion" required>
            <option value="">Sélectionnez...</option>
            <option>Hélicoptère</option>
            <option>Avion de Chasse</option>
            <option>Transport / Commercial</option>
            <option>Autre</option>
        </select>

        <label>Notes :</label>
        <textarea id="notes"></textarea>

        <button type="submit">Enregistrer le Plan de Vol</button>
    </form>

    <div id="message"></div>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1469078801890672833/fLPN-HKIyjKFrcaaRK-HhyOf8O-gDM8IO2HQWbb9QuFDGmCtw1h_9j8NCZP9SzIOL7ZV";

document.getElementById("volForm").addEventListener("submit", async e => {
    e.preventDefault();

    document.getElementById("loadingOverlay").style.display = "flex";
    const start = Date.now();

    const embed = {
        title: "🛩️ Nouveau Plan de Vol",
        color: 0x4B5320,
        fields: [
            { name: "👤 Pilote", value: pilote.value, inline: true },
            { name: "✈️ Vol", value: numeroVol.value, inline: true },
            { name: "📅 Date", value: date.value, inline: true },
            { name: "⏱️ Départ", value: heureDepart.value, inline: true },
            { name: "⏱️ Arrivée", value: heureArrivee.value, inline: true },
            { name: "📍 Départ", value: depart.value, inline: true },
            { name: "📍 Arrivée", value: arrivee.value, inline: true },
            { name: "🛩️ Avion", value: typeAvion.value, inline: true },
            { name: "📝 Notes", value: notes.value || "Aucune" }
        ],
        footer: { text: "La Défense — Plan de Vol" },
        timestamp: new Date()
    };

    await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [embed] })
    });

    const wait = 10000 - (Date.now() - start);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));

    document.getElementById("loadingOverlay").style.display = "none";
    document.getElementById("message").textContent = "Plan de vol envoyé sur Discord ✅";
    e.target.reset();
});
</script>

</body>
</html>
