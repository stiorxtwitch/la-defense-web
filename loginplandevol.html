<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Défense : Connexion</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/cotrnBV.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('https://i.imgur.com/7yarc9G.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(75, 83, 32, 0.25);
            z-index: -2;
        }
        .container {
            background-color: rgba(30, 35, 25, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 50px 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
        }
        .logo {
            max-width: 160px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.4em;
            margin-bottom: 40px;
        }
        label {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 25px;
            border-radius: 8px;
            border: none;
            font-size: 1.1em;
            background-color: rgba(255,255,255,0.12);
            color: white;
        }
        input:focus {
            outline: none;
            background-color: rgba(255,255,255,0.25);
        }
        button {
            background-color: #4B5320;
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.3em;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        button:hover {
            background-color: #3e451b;
        }
        #error {
            margin-top: 20px;
            color: #ff5555;
            font-size: 1.1em;
            min-height: 24px;
        }
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        #loadingOverlay img {
            width: 120px;
        }
        #loadingOverlay p {
            font-size: 1.8em;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div id="loadingOverlay">
    <img src="https://www.pngmart.com/files/23/Loading-PNG-Photos.gif">
    <p>Connexion en cours...</p>
</div>

<div class="container">
    <img src="https://i.imgur.com/cotrnBV.png" class="logo" alt="Logo La Défense">

    <h1>Connexion</h1>

    <form id="loginForm">
        <label for="username">Nom d'utilisateur :</label>
        <input type="text" id="username" autocomplete="username" required>

        <label for="password">Mot de passe :</label>
        <input type="password" id="password" autocomplete="current-password" required>

        <button type="submit">Se connecter</button>
    </form>

    <div id="error"></div>
</div>

<script>
    // URL avec proxy CORS intégré
    const SCRIPT_URL = "https://corsproxy.io/?https://script.google.com/macros/s/AKfycbxFWbt92hR5IDwIJ7IdUm_Ehq4XeVs6YHAfyPN0yZdTuu3h7MPPslMTZDYBAg6c1yJpbw/exec";

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const errorDiv = document.getElementById("error");
        const loading = document.getElementById("loadingOverlay");

        errorDiv.textContent = "";
        loading.style.display = "flex";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            errorDiv.textContent = "Veuillez remplir tous les champs.";
            loading.style.display = "none";
            return;
        }

        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });

            if (!response.ok) {
                throw new Error(`Erreur HTTP ${response.status}`);
            }

            const result = await response.json();

            if (result.success === true) {
                console.log("Connexion réussie ! Redirection...");
                window.location.href = "logsplanvol.html";
            } else {
                errorDiv.textContent = "Identifiants incorrects.";
            }
        } catch (err) {
            console.error("Erreur fetch:", err);
            errorDiv.textContent = "Erreur de connexion au serveur. Vérifie l'URL ou essaie à nouveau.";
        } finally {
            loading.style.display = "none";
        }
    });
</script>
</body>
</html>
