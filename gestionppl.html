<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion PPL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://i.imgur.com/7yarc9G.jpeg') center/cover fixed;
    color: white;
}
.container {
    max-width: 1000px;
    margin: 40px auto;
    padding: 40px;
    background: rgba(30,35,25,0.45);
    backdrop-filter: blur(12px);
    border-radius: 16px;
}
.person-item {
    padding: 15px;
    background: rgba(255,255,255,0.1);
    margin-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
}
.person-item:hover { background: rgba(255,255,255,0.2); }
.detail-panel {
    margin-top: 30px;
    padding: 20px;
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    display: none;
}
.flight {
    padding: 10px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
}
button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #4B5320;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h1>Gestion PPL</h1>

    <ul id="personList"></ul>

    <div id="detailPanel" class="detail-panel">
        <h2 id="detailName"></h2>
        <div id="detailInfo"></div>

        <h3>Plans de vol (en tant que pilote)</h3>
        <div id="flightsList"></div>

        <button onclick="closeDetail()">Fermer</button>
    </div>
</div>

<script>
/* ===================== SUPABASE ===================== */

const SUPABASE_URL = 'https://gktawbaposndfxijkxdk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdGF3YmFwb3NuZGZ4aWpreGRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNzUyNDUsImV4cCI6MjA3OTY1MTI0NX0.tY-CHuyb2zr9s6hlGkwmrdTvg920VVNghI9S45CjwKk';

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

/* ===================== CHARGEMENT PPL ===================== */

async function loadPersons() {
    const { data, error } = await supabaseClient
        .from('ppl-gestion')
        .select('*')
        .order('nom');

    const list = document.getElementById('personList');
    list.innerHTML = '';

    if (error || !data) {
        list.innerHTML = '<p>Erreur chargement profils</p>';
        return;
    }

    data.forEach(person => {
        const li = document.createElement('li');
        li.className = 'person-item';
        li.textContent = `${person.prenom} ${person.nom}`;
        li.onclick = () => showDetail(person);
        list.appendChild(li);
    });
}

/* ===================== DÉTAIL PPL ===================== */

function showDetail(person) {
    document.getElementById('detailName').textContent =
        `${person.prenom} ${person.nom}`;

    document.getElementById('detailInfo').innerHTML = `
        <p>Théorie Avion : ${person.theorieavion ? 'Oui' : 'Non'}</p>
        <p>Permis Avion : ${person.permisavion ? 'Oui' : 'Non'}</p>
        <p>Théorie Hélico : ${person.theoriehelico ? 'Oui' : 'Non'}</p>
        <p>Permis Hélico : ${person.permishelico ? 'Oui' : 'Non'}</p>
        <p>Instructeur : ${person.instructeur || '—'}</p>
    `;

    loadFlightsForPilot(person.nom, person.prenom);

    document.getElementById('detailPanel').style.display = 'block';
}

/* ===================== MATCH PILOTE (PRENOM NOM / NOM PRENOM) ===================== */

async function loadFlightsForPilot(nom, prenom) {
    const flightsList = document.getElementById('flightsList');
    flightsList.innerHTML = '<p>Chargement...</p>';

    const prenomNom = `${prenom} ${nom}`.trim();
    const nomPrenom = `${nom} ${prenom}`.trim();

    const { data, error } = await supabaseClient
        .from('logs-plandevol')
        .select('*')
        .or(
            `pilote.ilike.${prenomNom},pilote.ilike.${nomPrenom}`
        )
        .order('created_at', { ascending: false });

    if (error || !data || data.length === 0) {
        flightsList.innerHTML = '<p>Aucun plan de vol trouvé.</p>';
        return;
    }

    flightsList.innerHTML = '';

    data.forEach(vol => {
        const div = document.createElement('div');
        div.className = 'flight';
        div.innerHTML = `
            <strong>${vol.dateduvol || '—'}</strong><br>
            ${vol.lieudepart || '?'} → ${vol.lieuarrive || '?'}<br>
            <small>${vol.modele || '—'} | ${vol.typeavion || '—'}</small>
        `;
        flightsList.appendChild(div);
    });
}

/* ===================== UI ===================== */

function closeDetail() {
    document.getElementById('detailPanel').style.display = 'none';
}

/* ===================== INIT ===================== */

loadPersons();
</script>

</body>
</html>
